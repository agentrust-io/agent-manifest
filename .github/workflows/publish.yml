name: Publish to PyPI

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build twine
      - name: Build wheel and sdist
        working-directory: python
        run: python -m build
      - name: Verify dist
        working-directory: python
        run: twine check dist/*
      - name: Install and smoke-test wheel and sdist
        shell: bash
        run: |
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/python-v* ]] && [[ "${GITHUB_REF_NAME#python-v}" != "$expected_version" ]]; then
            echo "tag version ${GITHUB_REF_NAME#python-v} does not match package version $expected_version" >&2
            exit 1
          fi
          index=0
          for artifact in python/dist/*.whl python/dist/*.tar.gz; do
            index=$((index + 1))
            venv="$RUNNER_TEMP/agent-manifest-dist-$index"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check "${artifact}[cli]"
            (
              cd "$RUNNER_TEMP"
              "$venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_python_distribution.py" \
                --expected-version "$expected_version" \
                --forbidden-source-root "$GITHUB_WORKSPACE/python/src"
              "$venv/bin/manifest" --help >/dev/null
            )
          done
          test "$index" -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install AGT as isolated release tooling
        run: |
          python -m venv .agt-venv
          .agt-venv/bin/python -m pip install --upgrade pip "agent-governance-toolkit>=4.1"
          .agt-venv/bin/python -m pip install --no-deps -e python

      - name: Generate evidence file
        run: .agt-venv/bin/python scripts/gen_agt_evidence.py

      - name: Verify AGT runtime evidence (isolated)
        run: |
          set +e
          output=$(.agt-venv/bin/agt verify --evidence agt-evidence.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq "Runtime Evidence: 6/6 checks passed"
          test "$status" -eq 0 || test "$status" -eq 1

      - name: Save attestation JSON
        run: |
          set +e
          .agt-venv/bin/agt --json verify --evidence agt-evidence.json > agt-attestation.json
          status=$?
          set -e
          python -m json.tool agt-attestation.json > /dev/null
          test "$status" -eq 0 || test "$status" -eq 1

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            agt-evidence.json
            agt-attestation.json
          generate_release_notes: true
