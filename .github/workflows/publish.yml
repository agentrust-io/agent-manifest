name: Publish to PyPI

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Build artifacts only, or publish from a matching python-v tag"
        required: true
        type: choice
        options: [build-only, publish]
        default: build-only

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: validate
    if: success() && needs.validate.result == 'success'
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements/release.txt
      - name: Verify publication source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$RELEASE_MODE" in
              build-only) exit 0 ;;
              publish) ;;
              *) echo "::error::manual run requires build-only or publish mode"; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" != "push" ]; then
            echo "::error::unsupported publication event"
            exit 1
          fi
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF" = "refs/tags/python-v$expected_version" || {
            echo "::error::publication requires refs/tags/python-v$expected_version"
            exit 1
          }
      - name: Build wheel and sdist
        working-directory: python
        run: python -m build
      - name: Verify dist
        working-directory: python
        run: twine check dist/*
      - name: Install and smoke-test wheel and sdist
        shell: bash
        run: |
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/python-v* ]] && [[ "${GITHUB_REF_NAME#python-v}" != "$expected_version" ]]; then
            echo "tag version ${GITHUB_REF_NAME#python-v} does not match package version $expected_version" >&2
            exit 1
          fi
          index=0
          for artifact in python/dist/*.whl python/dist/*.tar.gz; do
            index=$((index + 1))
            venv="$RUNNER_TEMP/agent-manifest-dist-$index"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check "${artifact}[cli]"
            (
              cd "$RUNNER_TEMP"
              "$venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_python_distribution.py" \
                --expected-version "$expected_version" \
                --forbidden-source-root "$GITHUB_WORKSPACE/python/src"
              "$venv/bin/manifest" --help >/dev/null
            )
          done
          test "$index" -eq 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/

  publish:
    if: >-
      success() && needs.validate.result == 'success' && needs.build.result == 'success' &&
      startsWith(github.ref, 'refs/tags/python-v') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    name: Publish to PyPI
    environment: pypi
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install AGT as isolated release tooling
        run: |
          python -m venv .agt-venv
          # --no-deps because the lock already lists every transitive
          # dependency, and pip would otherwise re-resolve and reject the
          # cryptography override the compile deliberately applied.
          .agt-venv/bin/python -m pip install --require-hashes --no-deps -r requirements/agt.txt
          .agt-venv/bin/python -m pip install --no-deps -e python

      - name: Generate evidence file
        run: .agt-venv/bin/python scripts/gen_agt_evidence.py

      - name: Verify AGT runtime evidence (isolated)
        run: |
          set +e
          output=$(.agt-venv/bin/agt verify --evidence agt-evidence.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq "Runtime Evidence: 6/6 checks passed"
          test "$status" -eq 0 || test "$status" -eq 1

      - name: Save attestation JSON
        run: |
          set +e
          .agt-venv/bin/agt --json verify --evidence agt-evidence.json > agt-attestation.json
          status=$?
          set -e
          python -m json.tool agt-attestation.json > /dev/null
          test "$status" -eq 0 || test "$status" -eq 1

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.0
        with:
          files: |
            dist/*
            agt-evidence.json
            agt-attestation.json
          generate_release_notes: true
