name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements/docs.txt"
      - "requirements/server.txt"
      - "python/src/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "ROADMAP.md"
      - "LIMITATIONS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mkdocs gh-deploy pushes the gh-pages branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Configure git for gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install docs dependencies
        run: |
          pip install --require-hashes -r requirements/docs.txt
          pip install --require-hashes -r requirements/server.txt
          pip install --no-deps -e python

      - name: Build and deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean
