name: CodeQL

on:
  # No paths filter: Scorecard SAST counts every merged commit, and a PR that
  # only touches docs or workflows otherwise lands without a CodeQL run.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # Weekly on Monday at 03:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
          queries: security-extended
          # Deterministic test-vector fixtures use a fixed, published, non-secret
          # seed (see python/tests/vectors/generate.py) and never persist private
          # key material. Exclude them so the fixed test seed does not trip the
          # clear-text-storage query. Production code stays fully scanned.
          config: |
            paths-ignore:
              - python/tests/vectors/**

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:python
          upload: if-supported
