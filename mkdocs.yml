site_name: Agent Manifest
site_description: Cryptographic identity and provenance standard for AI agents
site_url: https://manifest.agentrust-io.com
repo_url: https://github.com/agentrust-io/agent-manifest
repo_name: agentrust-io/agent-manifest
edit_uri: edit/main/docs/
docs_dir: docs

exclude_docs: |
  adr/0000-template.md

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.code.annotate
    - content.tooltips
    - navigation.instant.progress
    - navigation.footer
    - navigation.expand
    - search.share
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Agent Manifest is an open standard for the cryptographic identity and
        provenance of AI agents. It anchors the 10 artifacts that define an
        agent at deployment (system prompt, policy bundle, tool manifest, model
        identity, RAG corpus, memory baseline, decision-log baseline, A2A delegation,
        supply chain, and HITL approvals) so a verifier who does not trust the
        operator can prove the agent running in production is the one that was
        approved. Level 0 is software-only Ed25519 signing; Levels 1 to 3 add
        TEE attestation (TPM, AMD SEV-SNP, Intel TDX, OPAQUE) and post-quantum
        profiles.
      sections:
        Getting started:
          - index.md
          - getting-started.md
        Specification:
          - spec-overview.md
        Guides:
          - tutorials/index.md
        Reference:
          - api-reference/index.md
          - compliance/index.md
  - minify:
      minify_html: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            unwrap_annotated: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentrust-io/agent-manifest
      name: agent-manifest on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-manifest/
      name: agent-manifest on PyPI
  generator: false
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback — open an issue to let us know.

extra_css:
  # Shared AgenTrust editorial design system. Deliberately the only stylesheet:
  # a local override here is how this site drifted to the Material default
  # violet last time. Change the shared file instead.
  - https://agentrust-io.com/design-system.css

