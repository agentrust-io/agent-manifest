[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-manifest"
version = "0.11.2"
description = "Agent Manifest SDK — cryptographically anchor all 10 artifacts defining an AI agent at deployment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "AgenTrust Authors", email = "imransiddique@live.com"}]
keywords = [
  "ai-agents", "attestation", "governance", "tee", "confidential-computing",
  "mcp", "agent-manifest", "trust", "hardware-attestation", "pydantic",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "cryptography>=42,<51",
  # COSE envelope for manifest version 0.2 (ADR-0011, ADR-0013). Serialization
  # only - the COSE structures are built in _cose.py and every signature stays
  # on cryptography (and optionally the liboqs bindings for ML-DSA-65).
  "cbor2>=5.6,<7",
]

[project.optional-dependencies]
# ML-DSA-65 comes from cryptography, which gained it in 47.0.0. The extra
# exists to raise the floor for callers who need the post-quantum profile;
# it no longer names a liboqs package, because the `pyoqs` distribution this
# previously required is not published on PyPI and the `oqs` module name
# there belongs to an unrelated project. Deployments already carrying the
# liboqs bindings keep working: _signing detects them and dispatches on the
# key material.
pq      = ["cryptography>=47"]
server  = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "httpx>=0.27"]
cli     = ["click>=8.1"]
all     = ["cryptography>=47", "fastapi>=0.111", "uvicorn[standard]>=0.29", "httpx>=0.27", "click>=8.1"]
dev     = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "httpx>=0.27",
           "jcs>=0.2", "fastapi>=0.111", "uvicorn[standard]>=0.29",
           "click>=8.1", "mypy>=1.10", "bandit[toml]>=1.7", "pip-audit>=2.7"]

[project.scripts]
manifest = "agent_manifest.cli:main"

[project.urls]
Homepage      = "https://github.com/agentrust-io/agent-manifest"
Repository    = "https://github.com/agentrust-io/agent-manifest"
Documentation = "https://github.com/agentrust-io/agent-manifest/tree/main/spec"
"Bug Tracker" = "https://github.com/agentrust-io/agent-manifest/issues"
Changelog     = "https://github.com/agentrust-io/agent-manifest/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_manifest"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agent_manifest._hw_providers"
warn_unused_ignores = false

[tool.coverage.run]
source = ["src/agent_manifest"]
omit = ["src/agent_manifest/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
# B101: assert statements (test helpers); B404/B603/B607: TPM attestation
# providers require subprocess — inputs are validated before the call and
# never include user-controlled data, so these are false positives.
skips = ["B101", "B404", "B603", "B607"]
